services:
  postgres:
    image: postgres:16-alpine
    container_name: agendapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agendapp
      POSTGRES_PASSWORD: agendapp_dev_password
      POSTGRES_DB: agendapp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agendapp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendapp -d agendapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: agendapp-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  agendapp_pg_data: